<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends "base.html" %}

{% block content %}
<h2 style="text-align:center; margin:20px 0;">🛒 سبد خرید</h2>

<table style="width:80%; margin:0 auto; border-collapse:collapse; box-shadow:0 0 10px rgba(0,0,0,0.1);">
  <tr style="background:#f5f5f5; text-align:center;">
    <th style="padding:12px; border:1px solid #ddd;">محصول</th>
    <th style="padding:12px; border:1px solid #ddd;">تعداد</th>
    <th style="padding:12px; border:1px solid #ddd;">قیمت</th>
    <th style="padding:12px; border:1px solid #ddd;">عملیات</th>
  </tr>
  {% for item in items %}
  <tr style="text-align:center;">
    <td style="padding:12px; border:1px solid #ddd;">{{ item.product.name }}</td>
    <td style="padding:12px; border:1px solid #ddd;">
      {{ item.qty }}
    </td>
    <td style="padding:12px; border:1px solid #ddd;">{{ item.subtotal }} تومان</td>
    <td style="padding:12px; border:1px solid #ddd;">
      <!-- لینک افزایش -->
      <a href="{% url 'update_cart' item.product.id 'increase' %}"
         style="background:#4CAF50; color:white; padding:6px 12px; text-decoration:none; border-radius:5px; margin:2px;">➕</a>
      <!-- لینک کاهش -->
      <a href="{% url 'update_cart' item.product.id 'decrease' %}"
         style="background:#f44336; color:white; padding:6px 12px; text-decoration:none; border-radius:5px; margin:2px;">➖</a>
    </td>
  </tr>
  {% empty %}
  <tr>
    <td colspan="4" style="padding:15px; text-align:center;">سبد خرید شما خالی است</td>
  </tr>
  {% endfor %}
</table>

<p style="text-align:center; margin-top:20px; font-size:18px;">
  <strong>مجموع: {{ total }} تومان</strong>
</p>

{% endblock %}
</body>
</html>
